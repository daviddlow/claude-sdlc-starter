# Response tiers for the closing-the-loop play (Stage 6).
# Detection is entirely deterministic (monitoring/detect.py) — no model is
# involved until a band is breached, and the tier sets what Claude may do.
metric: ci_test_failure_rate
baseline: rolling_30d
rules: western_electric
tiers:
  1sigma: { action: log }
  2sigma: { action: diagnose,
            tools: "Read,Grep,Bash(gh run view *)" }
  3sigma: { action: propose,
            routes: [pull_request, runbook:rollback-deploy] }
